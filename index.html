<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mario Bencomo | Full Stack Developer</title>
    <meta name="description" content="Portafolio profesional de Mario Bencomo — Desarrollador Full Stack." />
    <meta name="author" content="Mario Bencomo" />
    <meta property="og:title" content="Mario Bencomo | Full Stack Developer" />
    <meta property="og:description" content="Desarrollador Full Stack. Soluciones digitales funcionales y escalables." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@400..800&display=swap" rel="stylesheet">
    <!-- Preload hero image — LCP crítico, se busca antes que React cargue -->
    <link rel="preload" as="image" href="/profile_photo_upscaled.png" />
    <!-- SVG favicon: adapta colores según prefers-color-scheme del sistema -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fallback PNG para navegadores sin soporte SVG -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Force dark mode before React loads to prevent flash of light mode -->
    <script>document.documentElement.classList.add('dark'); document.documentElement.classList.remove('light'); localStorage.setItem('theme','dark');</script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
